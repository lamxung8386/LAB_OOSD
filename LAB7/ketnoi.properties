# Che do luu tru: sqlserver hoac file
che_do=sqlserver

# Cau hinh cho SQL Server tren may ban. localhost va DB da xac nhan qua SSMS.
# Port 1433 la gia dinh can KIEM TRA trong SQL Server Configuration Manager.
jdbc.url=jdbc:sqlserver://localhost:1433;databaseName=QuanLyNhanSuDB;encrypt=true;trustServerCertificate=true;integratedSecurity=true;authenticationScheme=NativeAuthentication

# De trong neu dang dung Windows Authentication.
# Neu su dung SQL Authentication thi bo integratedSecurity=true trong URL va dien user/pass.
jdbc.user=
jdbc.password=
